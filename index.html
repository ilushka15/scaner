<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aanwezig</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
    :root { --ink:#1c1d1a; --muted:#77786f; --paper:#faf9f4; --panel:#fffefa; --line:#e3e1d8; --green:#5a6b3f; --green-dark:#3d4d2a; --success-bg:#eaf3de; --success:#3b6d11; --error-bg:#fcebeb; --error:#a32d2d; }
    * { box-sizing:border-box; } body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans',sans-serif; font-size:16px; }
    .shell { min-height:100vh; max-width:1180px; margin:auto; padding:28px 34px 56px; }
    header { display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); padding-bottom:22px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:600; font-size:20px; } .brand-mark { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; color:white; background:var(--green); font-size:20px; }
    nav { display:flex; gap:8px; } button, input, select { font:inherit; } button { cursor:pointer; border:0; border-radius:11px; padding:11px 17px; font-weight:600; background:var(--green); color:white; } button:hover { background:var(--green-dark); } button.ghost { color:var(--ink); background:transparent; } button.ghost:hover { background:#eeeee6; } button.danger { color:var(--error); background:var(--error-bg); padding:8px 12px; }
    .screen { padding-top:42px; animation:rise .35s ease both; } @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .eyebrow { color:var(--muted); font-size:14px; margin:0 0 8px; } h1 { font-size:36px; line-height:1.1; margin:0 0 10px; font-weight:500; letter-spacing:0; } h2 { font-size:22px; margin:0 0 22px; font-weight:600; } h3 { font-size:17px; margin:0 0 14px; } p { color:var(--muted); margin:0 0 18px; }
    .scan-hero { text-align:center; max-width:650px; margin:auto; } .scan-box { height:260px; margin:32px auto 24px; border:1px dashed #c8c8bd; border-radius:16px; display:grid; place-items:center; color:var(--muted); background:rgba(255,254,250,.45); } .scan-box strong { display:block; color:var(--ink); font-size:18px; font-weight:500; margin-bottom:8px; }
    .scan-form { display:flex; gap:10px; max-width:560px; margin:auto; } input, select { min-width:0; width:100%; border:1px solid var(--line); border-radius:11px; padding:12px 14px; color:var(--ink); background:var(--panel); outline:none; } input:focus, select:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(90,107,63,.12); }
    .feedback { min-height:28px; margin:18px 0 0; font-weight:600; } .feedback.success { color:var(--success); } .feedback.error { color:var(--error); } .today-list { max-width:560px; margin:45px auto 0; text-align:left; } .today-list h3 { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; } .mini-row { display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:1px solid var(--line); border-radius:11px; background:var(--panel); margin-top:8px; }
    .tabs { display:flex; gap:28px; border-bottom:1px solid var(--line); margin:32px 0 24px; } .tabs button { border-radius:0; color:var(--muted); background:none; padding:0 0 13px; border-bottom:2px solid transparent; } .tabs button.active { color:var(--ink); border-color:var(--green); }
    .toolbar { display:grid; grid-template-columns:150px 180px 1fr; align-items:end; gap:16px; margin-bottom:28px; } label { display:block; color:var(--muted); font-size:13px; margin-bottom:7px; } .check { display:flex; align-items:center; gap:8px; padding-bottom:12px; color:var(--ink); } .check input { width:16px; accent-color:var(--green); } .summary { display:flex; justify-content:space-between; align-items:end; margin-bottom:14px; } .summary h2 { margin:0 0 5px; } .summary p { margin:0; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--panel); } table { width:100%; border-collapse:collapse; min-width:650px; } th, td { text-align:left; padding:16px 18px; border-bottom:1px solid var(--line); } th { color:var(--muted); font-size:12px; letter-spacing:.08em; text-transform:uppercase; font-weight:500; } tr:last-child td { border-bottom:0; } .status { display:inline-block; padding:6px 10px; border-radius:8px; font-size:13px; font-weight:600; } .status.on-time { color:var(--success); background:var(--success-bg); } .status.late { color:var(--error); background:var(--error-bg); } .status.absent { color:var(--muted); background:#f0f0eb; }
    .management { display:grid; grid-template-columns:1.5fr 1fr; gap:22px; } .panel { border:1px solid var(--line); border-radius:14px; background:var(--panel); padding:24px; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px; } .form-grid .full { grid-column:1/-1; } .list { list-style:none; padding:0; margin:20px 0 0; } .list li { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:13px 0; border-top:1px solid var(--line); } .list small { display:block; color:var(--muted); margin-top:3px; }
    .empty { text-align:center; color:var(--muted); padding:34px; } .api-link { color:var(--green-dark); text-decoration:none; font-size:14px; }
    @media (max-width:700px) { .shell { padding:18px 16px 40px; } header { align-items:flex-start; gap:16px; } nav { flex-wrap:wrap; justify-content:flex-end; } h1 { font-size:30px; } .screen { padding-top:30px; } .scan-box { height:210px; } .scan-form { flex-direction:column; } .toolbar { grid-template-columns:1fr 1fr; } .toolbar > :last-child { grid-column:1/-1; } .management { grid-template-columns:1fr; } .form-grid { grid-template-columns:1fr; } .form-grid .full { grid-column:auto; } }
  </style>
</head>
<body>
  <div class="shell"><header><div class="brand"><span class="brand-mark">⌁</span><span>Aanwezig</span></div><nav><button class="ghost" onclick="navigate('scan')">Scanstation</button><button class="ghost" onclick="navigate('dashboard')">Dashboard</button></nav></header><main id="app"></main></div>
  <script src="/dist/src/frontend.js"></script><script type="text/plain">
    const state = { page:'scan', tab:'overview', date:new Date().toISOString().slice(0,10), group:'', search:'', lateOnly:false, data:{ students:[], groups:[], checkins:[] } };
    const api = async (path, options={}) => { const response = await fetch('/api/v1/attendance'+path, { headers:{'Content-Type':'application/json'}, ...options }); if(response.status===204)return null; const body=await response.json(); if(!response.ok)throw Error(body.message||'Er is iets misgegaan.'); return body; };
    const esc = (value) => String(value??'').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[char]);
    const dateLabel = (value) => new Intl.DateTimeFormat('nl-NL',{weekday:'long',day:'numeric',month:'long'}).format(new Date(value+'T12:00:00'));
    async function load(){ state.data=await api('/state?date='+encodeURIComponent(state.date)); render(); }
    function navigate(page){ state.page=page; render(); if(page==='dashboard') load().catch(showError); }
    function render(){ document.getElementById('app').innerHTML=state.page==='scan'?scanView():dashboardView(); }
    function scanView(){ const rows=state.data.checkins.map(item=>{const student=state.data.students.find(s=>s.studentnummer===item.studentnummer); return `<div class="mini-row"><span>${esc(student?.naam||item.studentnummer)}</span><span class="status ${item.status==='te laat'?'late':'on-time'}">${item.tijd} · ${esc(item.status)}</span></div>`}).join(''); return `<section class="screen scan-hero"><p class="eyebrow">Scanstation</p><h1>Houd je pas voor de scanner</h1><p>Of voer je studentnummer handmatig in als scannen niet lukt.</p><div class="scan-box"><div><strong>Wachten op scan...</strong><span>De scanner is klaar</span></div></div><form class="scan-form" onsubmit="scan(event)"><input id="scanCode" autocomplete="off" placeholder="Typ een studentnummer, bv. 252272" autofocus><button>Scan</button></form><div id="feedback" class="feedback"></div><div class="today-list"><h3>Vandaag ingecheckt (${state.data.checkins.length})</h3>${rows||'<p>Nog niemand ingecheckt vandaag.</p>'}</div></section>`; }
    function dashboardView(){ return `<section class="screen"><p class="eyebrow">Dashboard</p><h1>Overzicht en beheer</h1><div class="tabs"><button class="${state.tab==='overview'?'active':''}" onclick="setTab('overview')">Dagoverzicht</button><button class="${state.tab==='manage'?'active':''}" onclick="setTab('manage')">Studenten en groepen</button></div>${state.tab==='overview'?overviewView():manageView()}</section>`; }
    function overviewView(){ const filtered=state.data.students.filter(student=>{const checkin=state.data.checkins.find(item=>item.studentnummer===student.studentnummer); return (!state.group||student.groep===state.group)&&(!state.search||(`${student.naam} ${student.studentnummer}`).toLowerCase().includes(state.search.toLowerCase()))&&(!state.lateOnly||checkin?.status==='te laat'); }); const present=filtered.filter(s=>state.data.checkins.some(c=>c.studentnummer===s.studentnummer)).length; const rows=filtered.map(student=>{const checkin=state.data.checkins.find(item=>item.studentnummer===student.studentnummer); const status=checkin?.status||'afwezig'; return `<tr><td><strong>${esc(student.naam)}</strong><br><small>${esc(student.studentnummer)}</small></td><td>${esc(student.groep||'Geen groep')}</td><td>${checkin?.tijd||'-'}</td><td><span class="status ${status==='te laat'?'late':status==='op tijd'?'on-time':'absent'}">${esc(status)}</span></td></tr>`}).join(''); return `<div class="toolbar"><div><label for="date">Datum</label><input id="date" type="date" max="${new Date().toISOString().slice(0,10)}" value="${state.date}" onchange="changeDate(this.value)"></div><label class="check"><input type="checkbox" ${state.lateOnly?'checked':''} onchange="toggleLate(this.checked)"> Toon alleen te laat</label><div><label for="search">Zoeken</label><input id="search" value="${esc(state.search)}" oninput="searchStudents(this.value)" placeholder="Naam of studentnummer"></div><div><label for="group">Groep</label><select id="group" onchange="changeGroup(this.value)"><option value="">Alle groepen</option>${state.data.groups.map(group=>`<option ${state.group===group?'selected':''}>${esc(group)}</option>`).join('')}</select></div></div><div class="summary"><div><h2>${esc(dateLabel(state.date))}</h2><p>${present} van ${filtered.length} studenten ingecheckt</p></div><a class="api-link" href="/docs" target="_blank">Open API docs</a></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Groep</th><th>Ingecheckt</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="empty">Geen gegevens voor deze filters.</td></tr>'}</tbody></table></div>`; }
    function manageView(){ const students=state.data.students.map(s=>`<li><span><strong>${esc(s.naam)}</strong><small>${esc(s.studentnummer)} · ${esc(s.groep||'Geen groep')}</small></span><button class="danger" onclick="removeStudent(${s.id})">Verwijder</button></li>`).join(''); const groups=state.data.groups.map(g=>`<li><span>${esc(g)}</span><button class="danger" onclick="removeGroup('${encodeURIComponent(g)}')">Verwijder</button></li>`).join(''); return `<div class="management"><section class="panel"><h2>Studenten</h2><form class="form-grid" onsubmit="addStudent(event)"><input class="full" id="studentName" placeholder="Naam" required><input id="studentNumber" placeholder="Studentnummer" required><select id="studentGroup"><option value="">Geen groep</option>${state.data.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select><button class="full">Student toevoegen</button></form><ul class="list">${students||'<li>Geen studenten gevonden.</li>'}</ul></section><section class="panel"><h2>Groepen</h2><form class="form-grid" onsubmit="addGroup(event)"><input class="full" id="groupName" placeholder="Groepsnaam" required><button class="full">Groep toevoegen</button></form><ul class="list">${groups||'<li>Geen groepen gevonden.</li>'}</ul></section></div>`; }
    function setTab(tab){ state.tab=tab; render(); } function changeDate(value){ state.date=value; load().catch(showError); } function changeGroup(value){ state.group=value; render(); } function searchStudents(value){ state.search=value; const table=document.querySelector('.table-wrap'); if(table){ const current=state.tab; render(); state.tab=current; document.getElementById('search')?.focus(); } } function toggleLate(value){ state.lateOnly=value; render(); }
    async function run(action){ try{await action();await load();}catch(error){showError(error);} } function showError(error){ const target=document.getElementById('feedback'); if(target){target.textContent=error.message;target.className='feedback error';}else alert(error.message); }
    async function scan(event){ event.preventDefault(); const code=document.getElementById('scanCode').value; try { const result=await api('/scan',{method:'POST',body:JSON.stringify({code})}); await load(); const feedback=document.getElementById('feedback'); feedback.textContent=result.type==='ok'?`Welkom, ${result.student.naam} · ${result.student.groep||'Geen groep'} · ${result.tijd} · Ingecheckt.`:result.type==='dubbel'?`${result.student.naam} was al ingecheckt om ${result.tijd}.`:`Onbekend studentnummer: ${result.code}.`; feedback.className='feedback '+(result.type==='onbekend'?'error':'success'); document.getElementById('scanCode').value=''; } catch(error) { showError(error); } }
    function addStudent(event){event.preventDefault();run(()=>api('/students',{method:'POST',body:JSON.stringify({naam:studentName.value,studentnummer:studentNumber.value,groep:studentGroup.value||null})}));} function removeStudent(id){if(confirm('Student verwijderen?'))run(()=>api('/students/'+id,{method:'DELETE'}));} function addGroup(event){event.preventDefault();run(()=>api('/groups',{method:'POST',body:JSON.stringify({name:groupName.value})}));} function removeGroup(name){if(confirm('Groep verwijderen?'))run(()=>api('/groups/'+name,{method:'DELETE'}));}
    let buffer='',lastKey=0; document.addEventListener('keydown',event=>{if(event.target.tagName==='INPUT'||event.target.tagName==='SELECT')return;const now=Date.now();if(now-lastKey>300)buffer='';lastKey=now;if(event.key==='Enter'&&buffer){const input=document.getElementById('scanCode');if(input){input.value=buffer;scan({preventDefault:()=>{}});}buffer='';}else if(event.key.length===1)buffer+=event.key;});
    load().catch(showError);
  </script>
</body>
</html>
